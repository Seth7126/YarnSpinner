name: Release Yarn Spinner

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update version
        id: version
        run: ./get-version.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack NuGet
        run: dotnet pack -c Release /p:Version=${{ steps.version.outputs.SemVer }} -o ./nuget

      - name: Deploy to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet nuget push nuget/*.nupkg -k ${{ secrets.NUGET_KEY }} -s https://api.nuget.org/v3/index.json

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YarnSpinner-nupkg
          path: ./nuget/*.nupkg
          retention-days: 30

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Read release notes preface
        id: release_preface
        uses: juliangruber/read-file-action@v1
        with:
          path: .github/RELEASE_TEMPLATE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          body: |
            ${{ steps.release_preface.outputs.content }}
            ${{ steps.extract-release-notes.outputs.release_notes }}
          files: |
            ./nuget/*.nupkg
          fail_on_unmatched_files: true
