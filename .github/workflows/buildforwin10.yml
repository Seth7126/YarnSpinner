name: Build win10-x64 Yarn Spinner  
# -----------------------------------------------------------------------------
# 工作流目的说明：
# 本脚本用于 Yarn Spinner 项目的日常构建和测试流程。
# 核心修复在于新增了 dotnet publish 步骤，并通过直接指定 YarnSpinner.LanguageServer
# 目录（而非具体文件名）来避免 MSB1009 找不到工程文件的问题。
# 编译产出采用 win-x64 runtime 并打包为无须外部框架支持的单文件，
# 最后通过 upload-artifact v4 版本将产出暴露为工作流界面的可下载资源。
# -----------------------------------------------------------------------------


on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main, "feature/**", "release/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Fetch all commits
        run: git fetch --unshallow

      - name: Update version
        id: version
        run: ./get-version.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish for Windows (x64)
        # 直接传递目录名称，绕过手动猜测项目文件全名的问题
        run: dotnet publish YarnSpinner.LanguageServer --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:UseAppHost=true --output publish/win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: YarnLanguageServer-win-x64
          path: publish/win-x64/
          retention-days: 30
