name: Build Yarn Spinner (CI)

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main, "feature/**", "release/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update version
        id: version
        run: ./get-version.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack NuGet
        run: dotnet pack -c Release /p:Version=${{ steps.version.outputs.SemVer }} -o ./nuget

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YarnSpinner-nupkg
          path: ./nuget/*.nupkg
          retention-days: 30

      - name: Upload build binaries
        uses: actions/upload-artifact@v4
        with:
          name: YarnSpinner-binaries
          path: |
            YarnSpinner/bin/Release/**/*.dll
            YarnSpinner.Compiler/bin/Release/**/*.dll
          retention-days: 30
